exporters:
  awsemf:
    region: ${env:AWS_REGION}
    namespace: Ecommerce
    log_group_name: /ecommerce/metrics
    log_stream_name: ${env:COLLECTOR_ID}
    dimension_rollup_option: NoDimensionRollup
    retain_initial_value_of_delta_metric: true
    resource_to_telemetry_conversion:
      included:
        - service.name
        - deployment.environment.name
    metric_declarations:
      - dimensions:
          - [service.name, deployment.environment.name]
        metric_name_selectors: [".*"]
  awscloudwatchlogs:
    region: ${env:AWS_REGION}
    log_group_name: /ecommerce/application
    log_stream_name: ${env:COLLECTOR_ID}

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors:
        - memory_limiter
        - resource/common
        - batch
      exporters: [awsemf]
    logs:
      receivers: [otlp]
      processors:
        - memory_limiter
        - resource/common
        - batch
      exporters: [awscloudwatchlogs]
